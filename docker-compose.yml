services:
  lector:
    build:
      context: .
      args:
        PIPER_VOICE: ${PIPER_VOICE:-kokoro-ef_dora}
        PIPER_VOICES: ${PIPER_VOICES:-es_ES-davefx-medium es_MX-claude-high}
    image: lector-docx:latest
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      PIPER_VOICE: ${PIPER_VOICE:-kokoro-ef_dora}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    volumes:
      - audio_cache:/data
    restart: unless-stopped

volumes:
  audio_cache:
